name: Release

# Pushing a tag that equals the version in manifest.json (x.y.z, no "v")
# builds the plugin and opens a draft GitHub release with the files Obsidian
# downloads. Publish the draft by hand once the notes are written.
on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Check the tag against manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run test:s3
      - run: npm run build
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft main.js manifest.json
